<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 🎯 1. Primary Page Title (Browser Tab par yehi show hoga) -->
    <title>Al Quran Islamic Institute | Online Quran & Tajweed Classes Worldwide</title>

      name="description"
